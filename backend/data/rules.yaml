# Passline rule set: one entry per check, each citing its 2010 ADA Standards section.
# Generated from the original Python rules (services/feature_rules.py) and checked
# equal to them by tests/test_rules_engine.py. Edit this file, not Python.
# Conditions read Gemini-observed properties; measured rules come in a later phase.
# Ops: eq, in, is (true/false), is_not, gt. 'all' = every clause, 'any' = at least one.
# remediation_cost_usd ranges are unsourced placeholders carried over from the hackathon.

- id: door_width_narrow
  feature_type: door
  section: 404.2.3
  element: Door
  severity: critical
  when:
    all:
    - field: width_relative
      op: eq
      value: narrow
  finding: Door appears too narrow for wheelchair passage (minimum 32" clear width required).
  remediation_cost_usd:
  - 700
  - 2500
- id: door_hardware_knob
  feature_type: door_hardware
  section: 404.2.7
  element: Door Hardware
  severity: high
  when:
    all:
    - field: handle_type
      op: in
      value:
      - round_knob
      - knob
  finding: Round knob hardware requires tight grasp; lever-style hardware required.
  remediation_cost_usd:
  - 75
  - 200
- id: door_threshold_raised
  feature_type: door_threshold
  section: 404.2.5
  element: Door Threshold
  severity: medium
  when:
    all:
    - field: appears_raised
      op: is
      value: true
  finding: Threshold appears raised above ½" maximum; may impede wheelchair travel.
  remediation_cost_usd:
  - 200
  - 600
- id: door_closer_inward
  feature_type: door_closer
  section: 404.2.8
  element: Door Closer
  severity: low
  when:
    all:
    - field: present
      op: is
      value: true
    - field: swing_direction
      op: eq
      value: inward
  finding: Inward-swinging door with closer may be difficult for wheelchair users; check closing speed.
  remediation_cost_usd:
  - 150
  - 400
- id: toilet_height
  feature_type: toilet
  section: '604.4'
  element: Toilet
  severity: medium
  when:
    all:
    - field: height_relative
      op: in
      value:
      - high
      - low
  finding: Toilet seat height appears {height_relative}; accessible range is 17"–19" from floor.
  remediation_cost_usd:
  - 500
  - 2000
- id: toilet_grab_bar_missing
  feature_type: toilet_grab_bar
  section: '604.5'
  element: Toilet Grab Bar
  severity: critical
  when:
    all:
    - field: present
      op: is
      value: false
  finding: No grab bars detected at toilet; grab bars are required on side and rear walls.
  remediation_cost_usd:
  - 300
  - 900
- id: toilet_grab_bar_one_side
  feature_type: toilet_grab_bar
  section: 604.5.1
  element: Toilet Grab Bar
  severity: high
  when:
    all:
    - field: present
      op: is_not
      value: false
    - field: both_sides
      op: is
      value: false
  finding: Grab bar detected on only one side; both side and rear grab bars are required.
  remediation_cost_usd:
  - 200
  - 600
