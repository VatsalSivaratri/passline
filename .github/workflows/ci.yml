name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Syntax errors and undefined names only, until the codebase is formatted.
      - run: ruff check . --select E9,F63,F7,F82
      # Depth parity tests skip here (no model weights in CI); everything else runs.
      - run: pytest tests -q
